<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spotify Clone | Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="site-header">

    <nav class="navbar">

        <a class="logo"
           href="index.html">
            Spotify
        </a>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="browse.html">
                Premium
            </a>

            <a href="browse.html">
                Support
            </a>

            <a class="active"
               href="signup.html">
                Download
            </a>

        </div>


        <a class="signup-small"
           href="signup.html">
            Sign up
        </a>

    </nav>

</header>


<main class="form-page">

    <form class="signup-form"
          action="#"
          method="post">


        <p class="eyebrow">
            GET STARTED
        </p>


        <h1>
            Create your account
        </h1>


        <p class="form-intro">

            Sign up to start listening
            to your favourite music.

        </p>


        <!-- Name -->

        <label for="name">
            Name
        </label>

        <input
            id="name"
            name="name"
            type="text"
            placeholder="Your name"
            required
        >


        <!-- Email -->

        <label for="email">
            Email address
        </label>

        <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
        >


        <!-- Password -->

        <label for="password">
            Password
        </label>

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Create a password"
            required
        >


        <!-- Terms -->

        <label class="checkbox">

            <input
                type="checkbox"
                name="terms"
                required
            >

            <span>
                I agree to the terms and conditions.
            </span>

        </label>


        <button
            class="btn form-button"
            type="submit">

            Sign up

        </button>


        <p class="back-link">

            <a href="index.html">
                ← Back to Home
            </a>

        </p>


    </form>

</main>


<footer class="footer">

    <div class="footer-brand">
        Spotify
    </div>


    <div class="footer-links">

        <a href="index.html">
            Home
        </a>

        <a href="browse.html">
            Browse
        </a>

        <a href="playlist.html">
            Playlist
        </a>

        <a href="signup.html">
            Sign up
        </a>

    </div>


    <p>
        © 2026 Spotify Clone — DevCamp 2.0
    </p>

</footer>

</body>
</html>
