<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spotify Clone | Browse</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="site-header">

    <nav class="navbar">

        <!-- Home / Logo at the start -->
        <a class="logo" href="index.html">
            Spotify
        </a>

        <!-- Navigation in the middle -->
        <div class="nav-links">

            <a class="active" href="index.html">
                Home
            </a>

            <a href="browse.html">
                Premium
            </a>

            <a href="browse.html">
                Support
            </a>

            <a href="signup.html">
                Download
            </a>

        </div>

        <!-- Sign up at the end -->
        <a class="signup-small" href="signup.html">
            Sign up
        </a>

    </nav>

</header>

<main class="page-main">


    <!-- Browse Header -->

    <section class="browse-header">

        <p class="eyebrow">
            EXPLORE MUSIC
        </p>

        <h1>
            Browse all
        </h1>

        <p>
            Choose a genre and find a playlist
            for every mood.
        </p>

    </section>


    <!-- Genre Cards -->

    <section class="genre-grid">


        <a class="genre-card"
           href="playlist.html">

            <span>Pop</span>

            <img
                src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=600&q=80"
                alt="Pop music concert"
            >

        </a>


        <a class="genre-card"
           href="playlist.html">

            <span>Hip-Hop</span>

            <img
                src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=600&q=80"
                alt="Hip-hop performer"
            >

        </a>


        <a class="genre-card"
           href="playlist.html">

            <span>Chill</span>

            <img
                src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=600&q=80"
                alt="Person listening to music"
            >

        </a>


        <a class="genre-card"
           href="playlist.html">

            <span>Workout</span>

            <img
                src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=600&q=80"
                alt="Workout session"
            >

        </a>


        <a class="genre-card"
           href="playlist.html">

            <span>Rock</span>

            <img
                src="https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?auto=format&fit=crop&w=600&q=80"
                alt="Rock concert"
            >

        </a>


        <a class="genre-card"
           href="playlist.html">

            <span>Electronic</span>

            <img
                src="https://images.unsplash.com/photo-1571266028243-d220c9c3b7c1?auto=format&fit=crop&w=600&q=80"
                alt="Electronic music event"
            >

        </a>


        <a class="genre-card"
           href="playlist.html">

            <span>Indie</span>

            <img
                src="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=600&q=80"
                alt="Indie music performance"
            >

        </a>


        <a class="genre-card"
           href="playlist.html">

            <span>Jazz</span>

            <img
                src="https://images.unsplash.com/photo-1415201364774-f6f0bb35f28f?auto=format&fit=crop&w=600&q=80"
                alt="Jazz musician"
            >

        </a>

    </section>

</main>


<footer class="footer">

    <div class="footer-brand">
        Spotify
    </div>


    <div class="footer-links">

        <a href="index.html">
            Home
        </a>

        <a href="browse.html">
            Browse
        </a>

        <a href="playlist.html">
            Playlist
        </a>

        <a href="signup.html">
            Sign up
        </a>

    </div>


</footer>

</body>
</html>
